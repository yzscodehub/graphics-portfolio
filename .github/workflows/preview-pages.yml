name: Deploy Public Preview

# FINAL CUTOVER:
# Main always verifies. Preview deployment is controlled by the persistent
# ENABLE_PREVIEW_PAGES repository variable. Set it to false in the release PR
# before creating the first stable version tag so main cannot replace Release.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build preview
    runs-on: ubuntu-latest
    outputs:
      deploy-pages: ${{ steps.deployment-policy.outputs.deploy }}
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io
      SITE_STAGE: preview
      SOURCE_REF: main
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve preview deployment policy
        id: deployment-policy
        shell: bash
        run: |
          if [[ "${{ vars.ENABLE_PREVIEW_PAGES }}" == "false" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Astro and TypeScript
        run: pnpm run check

      - name: Lint source
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format

      - name: Run unit tests
        run: pnpm run test

      - name: Build public preview
        run: pnpm run build

      - name: Validate content contract
        run: pnpm run test:content

      - name: Check built links
        run: pnpm run test:links

      - name: Verify Preview privacy and artifacts
        run: pnpm run verify:preview

      - name: Enforce performance budgets
        run: pnpm run test:performance

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run static browser checks
        run: pnpm run test:e2e

      - name: Configure GitHub Pages
        if: steps.deployment-policy.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        if: steps.deployment-policy.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy preview
    needs: build
    if: needs.build.outputs.deploy-pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
