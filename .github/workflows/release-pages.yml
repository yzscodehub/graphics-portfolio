name: Release GitHub Pages

# Version tags are the only indexed deployment source. The main workflow sees
# the tag and automatically remains verify-only after this cutover.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Release build
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io
      SITE_STAGE: release
      SOURCE_REF: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag and source commit
        shell: bash
        run: |
          if [[ "${{ vars.ENABLE_PREVIEW_PAGES }}" != "false" ]]; then
            echo "Set the persistent ENABLE_PREVIEW_PAGES repository variable to false before release." >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer, for example v1.0.0." >&2
            exit 1
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "The release tag must point to a commit contained in origin/main." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check, lint, and unit-test
        run: |
          pnpm run check
          pnpm run lint
          pnpm run format
          pnpm run test

      - name: Create guarded release build
        run: pnpm run build:release

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run static browser checks
        run: pnpm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
